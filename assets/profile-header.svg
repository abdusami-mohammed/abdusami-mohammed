<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Abdul Sami. I build reporting systems that run themselves." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121c"/>
      <stop offset="0.55" stop-color="#2a1f3a"/>
      <stop offset="1" stop-color="#3b2c12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#714B67"/>
      <stop offset="1" stop-color="#F2C811"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:700 52px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#ffffff}
    .tag{font:400 26px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e8e2f0}
    .sub{font:400 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#b9aec8}
    .b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(.15);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
    .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}.b5{animation-delay:.6s}.b6{animation-delay:.75s}
    .pulse{animation:pulse 2.4s ease-in-out 1.8s infinite}
    .fade{opacity:0;animation:fade .9s ease-out .2s forwards}
    @keyframes grow{to{transform:scaleY(1)}}
    @keyframes fade{to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.b,.fade,.pulse{animation:none;transform:none;opacity:1}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <path d="M0 255 C 300 225, 600 285, 900 245 S 1200 235, 1200 235 V300 H0Z" fill="#714B67" opacity=".35"/>
    <path d="M0 275 C 350 250, 700 300, 1200 260 V300 H0Z" fill="#F2C811" opacity=".12"/>

    <g class="fade">
      <text x="70" y="118" class="name">Abdul Sami</text>
      <text x="70" y="165" class="tag">I build reporting systems that run themselves.</text>
      <text x="70" y="205" class="sub">Odoo to Power BI, automated end to end. Working remotely with clients across the GCC and UK.</text>
    </g>

    <!-- a chart that builds itself -->
    <g transform="translate(905 70)">
      <line x1="0" y1="150" x2="230" y2="150" stroke="#ffffff" stroke-opacity=".25"/>
      <rect class="b"    x="8"   y="100" width="26" height="50"  rx="3" fill="url(#bar)"/>
      <rect class="b b2" x="46"  y="80"  width="26" height="70"  rx="3" fill="url(#bar)"/>
      <rect class="b b3" x="84"  y="90"  width="26" height="60"  rx="3" fill="url(#bar)"/>
      <rect class="b b4" x="122" y="55"  width="26" height="95"  rx="3" fill="url(#bar)"/>
      <rect class="b b5" x="160" y="35"  width="26" height="115" rx="3" fill="url(#bar)"/>
      <rect class="b b6" x="198" y="10"  width="26" height="140" rx="3" fill="url(#bar)"/>
      <circle class="pulse" cx="211" cy="-6" r="5" fill="#2ecc71"/>
    </g>
  </g>
</svg>
