<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Running Odoo and still reporting in Excel? Let's automate it. Email abdusami.mohammed@gmail.com" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1626"/>
      <stop offset="1" stop-color="#2b2117"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#714B67"/>
      <stop offset=".5" stop-color="#F2C811"/>
      <stop offset="1" stop-color="#714B67"/>
    </linearGradient>
  </defs>
  <style>
    .h{font:700 34px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
    .p{font:400 19px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#d9d1e4}
    .btn{font:600 18px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#1b1626}
    .trace{stroke-dasharray:240 2600;animation:trace 6s linear infinite}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes trace{to{stroke-dashoffset:-2840}}
    @keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.trace,.glow{animation:none}}
  </style>
  <rect x="4" y="4" width="1192" height="252" rx="18" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- a light that travels around the border -->
  <rect class="trace" x="4" y="4" width="1192" height="252" rx="18" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>

  <text x="60" y="88" class="h">Running Odoo and still reporting in Excel?</text>
  <text x="60" y="130" class="p">I'll connect your Odoo to Power BI and automate the whole pipeline, so your dashboards</text>
  <text x="60" y="158" class="p">are ready every morning. It works even on Odoo's shared hosting.</text>

  <g class="glow">
    <rect x="60" y="184" width="300" height="46" rx="23" fill="#F2C811"/>
    <text x="210" y="213" class="btn" text-anchor="middle">Email me about a project</text>
  </g>
  <text x="385" y="213" class="p" fill-opacity=".8">abdusami.mohammed@gmail.com</text>
</svg>
